[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-assistant"
version = "0.1.0"
description = "Local kitchen observations from recipe queries"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kitchen-assistant = "kitchen_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["kitchen_assistant*"]
